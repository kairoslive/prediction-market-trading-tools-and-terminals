name: Weekly link check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: run
        run: |
          python3 scripts/check_links.py > result.txt 2>&1 || echo "failed=true" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Record check date
        run: |
          python3 - <<'PY'
          import re,datetime,pathlib
          p=pathlib.Path('README.md'); t=p.read_text()
          t=re.sub(r"Last automated link check: \d{4}-\d{2}-\d{2}", "Last automated link check: "+datetime.date.today().isoformat(), t)
          p.write_text(t)
          PY
          git config user.name github-actions && git config user.email actions@github.com
          git commit -am "Weekly link check $(date -u +%F)" && git push || echo "no change"
      - if: steps.run.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('result.txt','utf8') + '\n```\nA human confirms before status changes in tools.json.';
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `Link check failures ${new Date().toISOString().slice(0,10)}`, body, labels: ['link-check'] });
